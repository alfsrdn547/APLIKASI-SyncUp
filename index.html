<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyncUp - Aplikasi Kolaborasi Tim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="authScreen" class="auth-screen">
      <div class="auth-card">
        <div class="auth-header">
          <div class="brand">
            <div class="brand-badge">S</div>
            <div>
              <h1>SyncUp</h1>
              <p>Workspace kolaborasi tim</p>
            </div>
          </div>
          <p class="auth-subtitle">Masuk untuk mengelola tugas, agenda, dan catatan tim Anda.</p>
        </div>

        <div class="auth-toggle">
          <button type="button" class="auth-tab active" data-auth-tab="login">Masuk</button>
          <button type="button" class="auth-tab" data-auth-tab="register">Daftar</button>
        </div>

        <div id="authMessage" class="auth-message" role="status"></div>

        <form id="loginForm" class="auth-form">
          <label>
            Email
            <input type="email" id="loginEmail" placeholder="nama@email.com" required />
          </label>
          <label>
            Password
            <input type="password" id="loginPassword" placeholder="Minimal 6 karakter" required />
          </label>
          <button class="primary-btn full" type="submit">Masuk</button>
        </form>

        <form id="registerForm" class="auth-form hidden">
          <label>
            Nama lengkap
            <input type="text" id="registerName" placeholder="Contoh: Alfi" required />
          </label>
          <label>
            Email
            <input type="email" id="registerEmail" placeholder="nama@email.com" required />
          </label>
          <label>
            Password
            <input type="password" id="registerPassword" placeholder="Minimal 6 karakter" required />
          </label>
          <label>
            Konfirmasi password
            <input type="password" id="registerConfirm" placeholder="Ulangi password" required />
          </label>
          <button class="primary-btn full" type="submit">Buat akun</button>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
